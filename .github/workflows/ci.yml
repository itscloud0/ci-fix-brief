name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Smoke test CLI
        run: ci-fix-brief examples/failing-pytest.log --format json

  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise GitHub Action with supplied log
        uses: ./
        with:
          log-file: examples/failing-pytest.log
          artifact-name: ci-fix-brief-action-smoke-${{ github.run_id }}
          retention-days: 1
